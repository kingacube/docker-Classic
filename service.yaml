apiVersion: v1
kind: Service
metadata:
  name: php-app-service
  labels:
    app: php-app
spec:
  selector:
    app: php-app
  ports:
    - protocol: TCP
      port: 80          # Service port
      targetPort: 80     # Container port your application listens on
  type: LoadBalancer      # Use NodePort if running on Minikube or local Kubernetes cluster

